<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Prediction</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#0f172a,#2563eb);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:40px;
        }

        .container{
            width:900px;
            background:#fff;
            border-radius:20px;
            padding:35px;
            box-shadow:0 15px 40px rgba(0,0,0,.25);
        }

        h1{
            text-align:center;
            color:#1e40af;
        }

        .subtitle{
            text-align:center;
            margin-top:10px;
            margin-bottom:30px;
            color:#555;
        }

        .grid{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:18px;
        }

        .field{
            display:flex;
            flex-direction:column;
        }

        label{
            margin-bottom:6px;
            font-weight:600;
            color:#333;
        }

        input,select{
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:15px;
        }

        input:focus,
        select:focus{
            outline:none;
            border-color:#2563eb;
        }

        button{
            width:100%;
            margin-top:30px;
            padding:15px;
            border:none;
            border-radius:10px;
            background:#2563eb;
            color:white;
            font-size:18px;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#1d4ed8;
        }

        .prediction{
            margin-top:30px;
            padding:18px;
            border-radius:10px;
            text-align:center;
            font-size:22px;
            font-weight:bold;
            background:#ecfdf5;
            color:#166534;
        }

        footer{
            margin-top:25px;
            text-align:center;
            color:#666;
            font-size:14px;
        }

        @media(max-width:768px){

            .container{
                width:100%;
            }

            .grid{
                grid-template-columns:1fr;
            }

        }

    </style>

</head>

<body>

<div class="container">

<h1>❤️ Heart Disease Prediction System</h1>

<p class="subtitle">
Machine Learning Based Healthcare Risk Assessment
</p>

<form action="/predict" method="POST">

<div class="grid">

<div class="field">
<label>Age</label>
<input type="number" name="age" required>
</div>

<div class="field">
<label>Sex</label>
<select name="sex">
<option value="1">Male</option>
<option value="0">Female</option>
</select>
</div>

<div class="field">
<label>Chest Pain Type</label>
<select name="cp">
<option value="0">Typical Angina</option>
<option value="1">Atypical Angina</option>
<option value="2">Non-Anginal Pain</option>
<option value="3">Asymptomatic</option>
</select>
</div>

<div class="field">
<label>Resting Blood Pressure</label>
<input type="number" name="trestbps" required>
</div>

<div class="field">
<label>Serum Cholesterol</label>
<input type="number" name="chol" required>
</div>

<div class="field">
<label>Fasting Blood Sugar > 120 mg/dl</label>
<select name="fbs">
<option value="1">Yes</option>
<option value="0">No</option>
</select>
</div>

<div class="field">
<label>Resting ECG</label>
<select name="restecg">
<option value="0">Normal</option>
<option value="1">ST-T Wave Abnormality</option>
<option value="2">Left Ventricular Hypertrophy</option>
</select>
</div>

<div class="field">
<label>Maximum Heart Rate</label>
<input type="number" name="thalach" required>
</div>

<div class="field">
<label>Exercise Induced Angina</label>
<select name="exang">
<option value="1">Yes</option>
<option value="0">No</option>
</select>
</div>

<div class="field">
<label>Old Peak</label>
<input type="number" step="0.1" name="oldpeak" required>
</div>

<div class="field">
<label>Slope</label>
<select name="slope">
<option value="0">Upsloping</option>
<option value="1">Flat</option>
<option value="2">Downsloping</option>
</select>
</div>

<div class="field">
<label>Major Vessels (0-3)</label>
<input type="number" min="0" max="3" name="ca" required>
</div>

<div class="field">
<label>Thal</label>
<select name="thal">
<option value="1">Normal</option>
<option value="2">Fixed Defect</option>
<option value="3">Reversible Defect</option>
</select>
</div>

</div>

<button type="submit">
🔍 Predict Heart Disease
</button>

</form>

{% if prediction %}

<div class="prediction">

{{ prediction }}

</div>

{% endif %}

<footer>

Developed using Flask • Scikit-Learn • Random Forest

</footer>

</div>

</body>

</html>
